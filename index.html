<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Siva Food – Portal Index</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', system-ui, sans-serif;
    background: linear-gradient(135deg, #FF6B35 0%, #2C3E50 100%);
    min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 20px;
  }
  .card { background: white; border-radius: 24px; padding: 32px 24px; max-width: 400px; width: 100%; box-shadow: 0 20px 60px rgba(0,0,0,0.3); text-align: center; }
  .logo { font-size: 60px; margin-bottom: 10px; }
  h1 { font-size: 28px; font-weight: 900; color: #2C3E50; margin-bottom: 4px; }
  p { font-size: 14px; color: #6C757D; margin-bottom: 28px; }
  .portal-btn {
    display: block; width: 100%; padding: 16px; border-radius: 14px; border: none;
    font-size: 16px; font-weight: 700; cursor: pointer; text-decoration: none;
    margin-bottom: 12px; transition: transform 0.15s;
  }
  .portal-btn:active { transform: scale(0.97); }
  .user-btn { background: linear-gradient(135deg, #FF6B35, #e55a26); color: white; }
  .admin-btn { background: linear-gradient(135deg, #2C3E50, #34495E); color: white; }
  .dev-btn { background: linear-gradient(135deg, #1A1A2E, #0F3460); color: white; }
  .footer { margin-top: 20px; font-size: 12px; color: #aaa; }
  .badge { display: inline-block; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 700; margin-left: 6px; vertical-align: middle; }
  .badge-orange { background: rgba(255,107,53,0.15); color: #FF6B35; }
  .badge-blue { background: rgba(44,62,80,0.15); color: #2C3E50; }
  .badge-dark { background: rgba(26,26,46,0.12); color: #1A1A2E; }
</style>
</head>
<body>
<div class="card">
  <div class="logo">🍽️</div>
  <h1 id="appTitle">SIVA FOOD</h1>
  <p>Food Token Booking System<br>Select your portal to continue</p>

  <a class="portal-btn user-btn" href="user.html">
    👤 User Portal <span class="badge badge-orange">Booking</span>
  </a>
  <a class="portal-btn admin-btn" href="admin.html">
    🛡️ Admin Portal <span class="badge badge-blue">Management</span>
  </a>
  <a class="portal-btn dev-btn" href="developer.html">
    ⚙️ Developer Portal <span class="badge badge-dark">System</span>
  </a>

  <div class="footer">
    Default Admin: ID <strong>ADMIN001</strong> / Pwd <strong>admin@123</strong><br>
    Default Dev: ID <strong>DEV001</strong> / Pwd <strong>dev@2024</strong>
  </div>
</div>
<script>
  try {
    const s = JSON.parse(localStorage.getItem('sivafood_settings') || '{}');
    if (s.appName) {
      document.getElementById('appTitle').textContent = s.appName;
      document.title = s.appName + ' – Portal Index';
    }
  } catch (e) {}
</script>
</body>
</html>
